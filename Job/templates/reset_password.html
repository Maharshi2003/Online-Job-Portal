{% load static %}
{% include 'Navigation.html' %}

<div class="page-header"><h1>Reset Password</h1></div>

<div class="cb-auth-wrap">
<form class="cb-auth-card" method="post">
    {% csrf_token %}
    <h2>Choose a new password</h2>

    <label for="pwd"><i class="fa fa-key mr-1"></i> New Password</label>
    <input type="password" id="pwd" name="pwd" class="form-control" placeholder="New password" required>

    <label for="cpwd"><i class="fa fa-key mr-1"></i> Confirm Password</label>
    <input type="password" id="cpwd" name="cpwd" class="form-control" placeholder="Confirm password" required>

    <button type="submit" class="btn btn-primary mt-4">Reset Password</button>
</form>
</div>

{% include 'Footer.html' %}

{% if error == "nomatch" %}
<script>alert("Passwords do not match!");</script>
{% endif %}
{% if error == "done" %}
<script>
    alert("Password reset successful!");
    window.location = "{% url 'User_login' %}";
</script>
{% endif %}
