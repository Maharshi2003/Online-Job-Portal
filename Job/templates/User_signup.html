<script>
    function checkpass()
    {
        if(document.signup.pwd.value!=document.signup.cpwd.value)
        {
            alert('password Does not match');
            document.signup.cpwd.focus();    <!--to blink the mouse cursur-->
            return false;
        }
        return true;    <!--form will be submit-->
    } 
    function togglePassword()
{
    var x = document.getElementById("pwd");
    var y = document.getElementById("eyeicon1");

    if(x.type === "password")
    {
        x.type = "text";
        y.classList.remove("fa-eye");
        y.classList.add("fa-eye-slash");
    }
    else
    {
        x.type = "password";
        y.classList.remove("fa-eye-slash");
        y.classList.add("fa-eye");
    }
}

function toggleConfirmPassword()
{
    var x = document.getElementById("cpwd");
    var y = document.getElementById("eyeicon2");

    if(x.type === "password")
    {
        x.type = "text";
        y.classList.remove("fa-eye");
        y.classList.add("fa-eye-slash");
    }
    else
    {
        x.type = "password";
        y.classList.remove("fa-eye-slash");
        y.classList.add("fa-eye");
    }
}
function updateCities()
{
    var state = document.getElementById("state").value;

    var cityDropdown = document.getElementById("city");

    // Remove old city options

    cityDropdown.innerHTML = '<option value="">Select City</option>';

    // State and Cities

    var cities = {

        "Gujarat": [
            "Ahmedabad",
            "Surat",
            "Vadodara",
            "Rajkot"
        ],

        "Maharashtra": [
            "Mumbai",
            "Pune",
            "Nagpur",
            "Nashik"
        ],

        "Rajasthan": [
            "Jaipur",
            "Udaipur",
            "Jodhpur"
        ]
    };

    // Add new cities

    if(state in cities)
    {
        cities[state].forEach(function(city)
        {
            var option = document.createElement("option");

            option.value = city;

            option.text = city;

            cityDropdown.appendChild(option);
        });
    }
}


function updateCategoryType()
{
    var category = document.getElementById("category").value;

    var categoryTypeDropdown =
        document.getElementById("category_type");

    categoryTypeDropdown.innerHTML =
        '<option value="">Select Category Type</option>';

    var categoryTypes = {

        "Internship": [

            "Python Intern",

            "Java Intern",

            "Web Development Intern",

            "Frontend Intern",

            "Backend Intern",

            "Full Stack Intern"

        ],

        "Junior Developer": [

            "Python Junior Developer",

            "Java Junior Developer",

            "React Junior Developer",

            "Frontend Developer",

            "Backend Developer"

        ],

        "Senior Developer": [

            "Java Senior Developer",

            "Python Senior Developer",

            "Senior Full Stack Developer",

            "Senior React Developer"

        ],

        "Fresher": [

            "Fresher Python Developer",

            "Fresher Java Developer",

            "Fresher Web Developer"

        ],

        "AI/ML Intern": [

            "Machine Learning Intern",

            "AI Intern",

            "Data Science Intern",

            "Deep Learning Intern"

        ]
    };

    if(category in categoryTypes)
    {
        categoryTypes[category].forEach(function(type)
        {
            var option = document.createElement("option");

            option.value = type;

            option.text = type;

            categoryTypeDropdown.appendChild(option);
        });
    }
}
</script>

<form id="signupForm" 
    class="container mt-5" 
    onsubmit="return checkpass();"
    name="signup" method="POST"  
    action="/User_signup_api/" 
    enctype="multipart/form-data">
    {% csrf_token %}
    
    <div class = "form-row">
        <div class="form-group col-md-6">
            <label><i class="fa fa-User mr-2"></i><b>First Name</b></label>
            <input type="text" class="form-control" name="Fname" placeholder="Enter First Name" required>
        </div>

        <div class="form-group col-md-6">
            <label><i class="fa fa-User mr-2"></i><b>Last Name</b></label>
            <input type="text" class="form-control" name="Lname" placeholder="Enter Last Name" required>
        </div>
    </div>

    <div class = "form-row">
        <div class="form-group col-md-12">   <!--12 is the size of the Box-->
            <label><i class="fa fa-phone-square mr-2"></i><b>Contact No</b></label>
            <input type="Contact" class="form-control" name="Contact" placeholder="Enter Contact Number">
        </div>
    </div>

    <div class = "form-row">
        <div class="form-group col-md-12">
            <label><i class="fa fa-envelope mr-2"></i><b>Email ID</b></label>
           <!--<input type="Email" class="form-control" name="Email" placeholder="Enter Email Address" required>-->
            <div class="input-group">

        <input type="text"
               class="form-control"
               name="Email"
               placeholder="Enter Gmail Username"
               required>

        <div class="input-group-append">
            <span class="input-group-text"
                  style="background-color:#f8f9fa;font-weight:bold;">
                @gmail.com
            </span>
        </div>

    </div>

        </div>
    </div>

    <div class = "form-row">        
        <div class="form-group col-md-6">

        <label>
            <i class="fa fa-map mr-2"></i>
            <b>State</b>
        </label>

        <select class="form-control"
                id="state"
                name="state"
                onchange="updateCities()"
                required>

            <option value="">Select State</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Rajasthan">Rajasthan</option>
        </select>
    </div>

    <!-- City Dropdown -->
    <div class="form-group col-md-6">
        <label>
            <i class="fa fa-building mr-2"></i>
            <b>City</b>
        </label>

        <select class="form-control"
                id="city"
                name="city"
                required>

            <option value="">Select City</option>
            
        </select>

    </div>
    </div>

    <div class = "form-row">

    <!-- Password -->

    <div class="form-group col-md-6">

        <label>
            <i class="fa fa-key mr-2"></i>
            <b>Password</b>
        </label>

        <div class="input-group">

            <input type="password"
                   class="form-control"
                   id="pwd"
                   name="pwd"
                   placeholder="Enter Password"
                   required>

            <div class="input-group-append">

                <span class="input-group-text"
                      onclick="togglePassword()"
                      style="cursor:pointer;">

                    <i class="fa fa-eye" id="eyeicon1"></i>

                </span>

            </div>

        </div>

    </div>

    <!-- Confirm Password -->

    <div class="form-group col-md-6">

        <label>
            <i class="fa fa-unlock mr-2"></i>
            <b>Confirm Password</b>
        </label>

        <div class="input-group">

            <input type="password"
                   class="form-control"
                   id="cpwd"
                   name="cpwd"
                   placeholder="Enter Password Again"
                   required>

            <div class="input-group-append">
                <span class="input-group-text"
                      onclick="toggleConfirmPassword()"
                      style="cursor:pointer;">

                    <i class="fa fa-eye" id="eyeicon2"></i>
                </span>
            </div>
        </div>
    </div>
</div>

    <!-- Category Dropdown -->

<div class="form-row">

    <div class="form-group col-md-6">

        <label>
            <i class="fa fa-list-alt mr-2"></i>
            <b>Category</b>
        </label>

        <select class="form-control"
                id="category"
                name="category"
                onchange="updateCategoryType()"
                required>

            <option value="">Select Category</option>

            <option value="Internship">Internship</option>

            <option value="Junior Developer">Junior Developer</option>

            <option value="Senior Developer">Senior Developer</option>

            <option value="Fresher">Fresher</option>

            <option value="AI/ML Intern">AI/ML Intern</option>

        </select>

    </div>

    <!-- Category Type Dropdown -->

    <div class="form-group col-md-6">

        <label>
            <i class="fa fa-tags mr-2"></i>
            <b>Category Type</b>
        </label>

        <select class="form-control"
                id="category_type"
                name="category_type"
                required>

            <option value="">Select Category Type</option>

        </select>

    </div>

</div>
