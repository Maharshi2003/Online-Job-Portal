{% load static %}
{% include 'Recruiter_navigation.html' %}

<div class="page-header"><h1>Change Password</h1></div>

<div class="cb-auth-wrap">
<form class="cb-auth-card" name="Changepass" method="post">
    {% csrf_token %}
    <h2>Update your password</h2>

    <label>Current Password</label>
    <input type="password" name="cpwd" class="form-control" required>

    <label>New Password</label>
    <input type="password" name="pwd" class="form-control" required>

    <label>Confirm New Password</label>
    <input type="password" name="cpwd" class="form-control" required>

    <button type="submit" class="btn btn-primary mt-4">Update Password</button>
</form>
</div>

{% include 'Footer.html' %}

{% if error == "no" %}
<script>
    alert("Password changed successfully!");
    window.location = "{% url 'Logout' %}";
</script>
{% endif %}
{% if error == "yes" %}
<script>alert("Something went wrong.");</script>
{% endif %}
{% if error == "not" %}
<script>alert("Current password is incorrect.");</script>
{% endif %}
