{% load static %}
{% include 'Navigation.html' %}

<div class="page-header"><h1>Forgot Password</h1></div>

<div class="cb-auth-wrap">
<form class="cb-auth-card" method="post">
    {% csrf_token %}
    <h2>Reset your password</h2>
    <p class="job-meta mb-3">Enter the email linked to your account. We'll send a one-time code.</p>

    <label for="email"><i class="fa fa-envelope mr-1"></i> Email</label>
    <input type="email" id="email" name="email" class="form-control cb-email-input" placeholder="Enter your email" required>

    <button type="submit" class="btn btn-primary mt-4">Send OTP</button>
    <p class="mt-3 mb-0"><a href="{% url 'User_login' %}" style="color:var(--cb-green);font-weight:600;">Back to login</a></p>
</form>
</div>

{% include 'Footer.html' %}

{% if error %}
<script>alert("{{ error|escapejs }}");</script>
{% endif %}
{% if error == "notfound" %}
<script>alert("Email not found!");</script>
{% endif %}
