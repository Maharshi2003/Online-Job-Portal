{% load static %}
{% include 'Company_navigation.html' %}

<div class="page-header"><h1>Change Recruiter Status</h1></div>

<div class="cb-auth-wrap">
<form class="cb-auth-card" method="post">
    {% csrf_token %}
    <h2>Update approval status</h2>

    <label>Recruiter</label>
    <input type="text" name="UserName" class="form-control"
           value="{{ recruiter.User.first_name }} {{ recruiter.User.last_name }}"
           readonly>

    <label>Status</label>
    <select name="status" class="form-control" required>
        <option value="Pending" {% if recruiter.status == "Pending" %}selected{% endif %}>Pending</option>
        <option value="Accepted" {% if recruiter.status == "Accepted" %}selected{% endif %}>Accepted</option>
        <option value="Rejected" {% if recruiter.status == "Rejected" %}selected{% endif %}>Rejected</option>
    </select>

    <button type="submit" class="btn btn-primary mt-4">Save Status</button>
    <p class="mt-3 mb-0"><a href="{% url 'Recruiter_pending' %}" style="color:var(--cb-green);font-weight:600;">Back to pending</a></p>
</form>
</div>

{% include 'Footer.html' %}

{% if error == "no" %}
<script>
    alert("Status updated successfully!");
    window.location = "{% url 'Recruiter_pending' %}";
</script>
{% endif %}
{% if error == "yes" %}
<script>alert("Something went wrong.");</script>
{% endif %}
