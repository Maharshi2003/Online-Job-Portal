{% load static %}

{% block body %}

{% include 'Company_navigation.html' %}

<style>
.custom-marquee {
    width: 100%;
    overflow: hidden;
    background-color: green;
    margin-top: 1%;
}

.custom-marquee span {
    display: inline-block;
    white-space: nowrap;
    font-family: 'Monotype';
    font-size: 25px;
    color: black;
    font-weight: bold;
    padding-left: 100%;
    animation: marquee 12s linear infinite;
}

@keyframes marquee {
    0% {
        transform: translateX(0%);
    }
    100% {
        transform: translateX(-100%);
    }
}
</style>

<div class="custom-marquee">
    <span> Company Profile </span>
</div>

<hr>

<div class="container">

    <div class="row">

        <div class="col-sm-12">

<form class="mt-5"
      name="companyprofile"
      method="POST"
      enctype="multipart/form-data">

    {% csrf_token %}

    <!-- Company Name -->

    <div class="form-row">

        <div class="form-group col-md-12">

            <label>
                <i class="fa fa-building mr-2"></i>
                <b>Company Name</b>
            </label>

            <input type="text"
                   class="form-control"
                   name="company_name"
                   value="{{company.company_name}}"
                   readonly
                   required>

        </div>

    </div>

    <!-- Email and Phone -->

    <div class="form-row">

        <div class="form-group col-md-6">

            <label>
                <i class="fa fa-envelope mr-2"></i>
                <b>Email ID</b>
            </label>

            <input type="email"
                   class="form-control"
                   name="email"
                   value="{{company.User.username}}"
                   readonly
                   required>

        </div>

        <div class="form-group col-md-6">

            <label>
                <i class="fa fa-phone mr-2"></i>
                <b>Phone Number</b>
            </label>

            <input type="text"
                   class="form-control"
                   name="phone"
                   value="{{company.phone_no}}"
                   readonly>

        </div>

    </div>

    <!-- Website -->

    <div class="form-row">

        <div class="form-group col-md-12">

            <label>
                <i class="fa fa-globe mr-2"></i>
                <b>Website</b>
            </label>

            <input type="url"
                   class="form-control"
                   name="website"
                   value="{{company.website}}"
                   readonly>

        </div>

    </div>

    <!-- Address -->

    <div class="form-row">

        <div class="form-group col-md-12">

            <label>
                <i class="fa fa-map-marker mr-2"></i>
                <b>Address</b>
            </label>

            <textarea class="form-control"
                      name="address"
                      rows="3"
                      >{{company.address}}</textarea>

        </div>

    </div>

    <!-- Country State City -->

    <div class="form-row">

        <div class="form-group col-md-4">

            <label>
                <i class="fa fa-globe mr-2"></i>
                <b>Country</b>
            </label>

            <input type="text"
                   class="form-control"
                   value="{{company.country}}"
                   readonly>

        </div>

        <div class="form-group col-md-4">

            <label>
                <i class="fa fa-map mr-2"></i>
                <b>State</b>
            </label>

            <input type="text"
                   class="form-control"
                   value="{{company.state}}"
                   readonly>

        </div>

        <div class="form-group col-md-4">

            <label>
                <i class="fa fa-building-o mr-2"></i>
                <b>City</b>
            </label>

            <input type="text"
                   class="form-control"
                   value="{{company.city}}"
                   readonly>

        </div>

    </div>

    <!-- Company Size and Established Year -->

    <div class="form-row">

        <div class="form-group col-md-6">

            <label>
                 <i class="fa fa-users mr-2"></i>
                <b>Company Size</b>
            </label>

            <input type="text"
                   class="form-control"
                   value="{{company.company_size}}"
                   readonly>

        </div>

        <div class="form-group col-md-6">

            <label>
                <i class="fa fa-calendar mr-2"></i>
                <b>Established Year</b>
            </label>

            <input type="text"
                   class="form-control"
                   value="{{company.established_year}}"
                   readonly>

        </div>

    </div>

    <!-- Description -->

    <div class="form-row">

        <div class="form-group col-md-12">

            <label>
                <i class="fa fa-file-text mr-2"></i>
                <b>Description</b>
            </label>

            <textarea class="form-control"
                      name="description"
                      rows="5">{{company.description|default_if_none:""}}</textarea>
                 
        </div>

    </div>

    <!-- Change Logo -->

    <div class="form-row">

        <div class="form-group col-md-12">

            <label>
                <i class="fa fa-image mr-2"></i>
                <b>Change Company Logo</b>
            </label>

            <input type="file"
                   class="form-control"
                   name="company_logo"
                   accept="image/*">

        </div>

    </div>

    <!-- Company Logo -->
<div class="row mt-4">

    <div class="col-sm-12 text-center">

        {% if company.company_logo  %}

            <img src="{{ company.company_logo.url }}"
                 width="300px"
                 height="300px"
                 style="
                    border-radius:10px;
                    border:2px solid lightgray;
                    object-fit:cover;
                 ">

        {% else %}

            <img src="{% static 'images/default_company.png' %}"
                 width="300px"
                 height="300px"
                 style="
                    border-radius:10px;
                    border:2px solid lightgray;
                    object-fit:cover;
                 ">

        {% endif %}

    </div>

</div>

    <br>

    <!-- Submit Button -->

    <input type="submit"
           value="Update Profile"
           class="btn btn-primary">

</form>

</div>

</div>

</div>

{% include 'footer.html' %}

{% if updated == "1" %}

<script>

    alert("Company Profile Updated Successfully");
    window.history.replaceState({}, document.title, "{% url 'Company_home' %}");

</script>

{% endif %}

{% if error == "yes" %}

<script>

    alert("Something Went Wrong, Try Again...");

</script>

{% endif %}

{% endblock %}
