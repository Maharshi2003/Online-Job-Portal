{% load static %}
{% include 'Navigation.html' %}

<div class="page-header"><h1>Verify OTP</h1></div>

<div class="cb-auth-wrap">
<form class="cb-auth-card" method="post">
    {% csrf_token %}
    <h2>Enter verification code</h2>
    <p class="job-meta mb-3">Check your email (or server console in development) for the 6-digit OTP.</p>

    <label for="otp"><i class="fa fa-shield mr-1"></i> OTP</label>
    <input type="text" id="otp" name="otp" class="form-control" placeholder="Enter OTP" required maxlength="6">

    <button type="submit" class="btn btn-primary mt-4">Verify OTP</button>
</form>
</div>

{% include 'Footer.html' %}
