{% load static %}
{% include 'Navigation.html' %}

<div class="page-header"><h1>Company Login</h1></div>

<div class="cb-auth-wrap">
<form class="cb-auth-card" method="post" action="{% url 'Company_login_api' %}">
    {% csrf_token %}
    <h2>Sign in to your company account</h2>

    <label for="username"><i class="fa fa-envelope mr-1"></i> Email</label>
    <input type="text" id="username" name="username" class="form-control cb-email-input" placeholder="Enter email" required>

    <label for="password"><i class="fa fa-key mr-1"></i> Password</label>
    <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>

    <div class="d-flex align-items-center mt-4 flex-wrap">
        <input type="submit" value="Login" class="btn btn-primary">
        <a href="{% url 'forgot_password' %}" class="ml-3 font-weight-bold" style="color:var(--cb-green);">Forgot Password?</a>
    </div>

    <p class="mt-4 mb-0">Don't have an account?
        <a href="{% url 'Company_Signup' %}" style="color:var(--cb-green);font-weight:700;">Register</a>
    </p>
</form>
</div>

{% include 'Footer.html' %}

{% if error == "yes" %}
<script>alert("Invalid Email or Password!");</script>
{% endif %}
{% if error == "not_company" %}
<script>alert("This account is not registered as a Company!");</script>
{% endif %}
