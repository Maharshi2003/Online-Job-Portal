{% load static %}
{% block body %}

{% include 'Recruiter_navigation.html' %}

<div class="container mt-4">

    <h3>Edit Job Details</h3>
    <hr>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Job Title -->

        <div class="form-group">
            <label><b>Job Title</b></label>
            <input type="text"
                   name="job_title"
                   class="form-control"
                   value="{{ job.job_title }}">
        </div>

        <!-- Category -->

        <div class="form-group">
            <label><b>Category</b></label>

            <select name="category" class="form-control">

                <option value="Internship"
                    {% if job.category.Category == "Internship" %}selected{% endif %}>
                    Internship
                </option>

                <option value="Junior Developer"
                    {% if job.category.Category == "Junior Developer" %}selected{% endif %}>
                    Junior Developer
                </option>

                <option value="Senior Developer"
                    {% if job.category.Category == "Senior Developer" %}selected{% endif %}>
                    Senior Developer
                </option>

                <option value="Fresher"
                    {% if job.category.Category == "Fresher" %}selected{% endif %}>
                    Fresher
                </option>

                <option value="AI/ML Intern"
                    {% if job.category.Category == "AI/ML Intern" %}selected{% endif %}>
                    AI/ML Intern
                </option>

            </select>
        </div>

        <!-- Category Type -->

        <div class="form-group">
            <label><b>Category Type</b></label>

            <select name="category_type" class="form-control">

                <option value="Python Intern" {% if job.category.Category_type == "Python Intern" %}selected{% endif %}>Python Intern</option>
                <option value="Java Intern" {% if job.category.Category_type == "Java Intern" %}selected{% endif %}>Java Intern</option>
                <option value="Python Developer" {% if job.category.Category_type == "Python Developer" %}selected{% endif %}>Python Developer</option>
                <option value="Java Developer" {% if job.category.Category_type == "Java Developer" %}selected{% endif %}>Java Developer</option>
                <option value="Python Junior Developer" {% if job.category.Category_type == "Python Junior Developer" %}selected{% endif %}>Python Junior Developer</option>
                <option value="Java Junior Developer" {% if job.category.Category_type == "Java Junior Developer" %}selected{% endif %}>Java Junior Developer</option>
                <option value="Python Senior Developer" {% if job.category.Category_type == "Python Senior Developer" %}selected{% endif %}>Python Senior Developer</option>
                <option value="Java Senior Developer" {% if job.category.Category_type == "Java Senior Developer" %}selected{% endif %}>Java Senior Developer</option>
                <option value="Full Stack Developer" {% if job.category.Category_type == "Full Stack Developer" %}selected{% endif %}>Full Stack Developer</option>
                <option value="AI/ML Intern" {% if job.category.Category_type == "AI/ML Intern" %}selected{% endif %}>AI/ML Intern</option>
                <option value="Data Analyst" {% if job.category.Category_type == "Data Analyst" %}selected{% endif %}>Data Analyst</option>
                <option value="Data Scientist" {% if job.category.Category_type == "Data Scientist" %}selected{% endif %}>Data Scientist</option>

            </select>
        </div>

        <!-- Experience -->

        <div class="form-group">
            <label><b>Experience</b></label>

            <select name="experience" class="form-control">

                <option value="0-1 Year">0-1 Year</option>
                <option value="1-1.5 Years">1-1.5 Years</option>
                <option value="1.5-2 Years">1.5-2 Years</option>
                <option value="2-3 Years">2-3 Years</option>
                <option value="3-4 Years">3-4 Years</option>
                <option value="4-5 Years">4-5 Years</option>
                <option value="5-6 Years">5-6 Years</option>
                <option value="6-7 Years">6-7 Years</option>
                <option value="7-8 Years">7-8 Years</option>
                <option value="8-9 Years">8-9 Years</option>
                <option value="9-10 Years">9-10 Years</option>
                <option value="10-12 Years">10-12 Years</option>
                <option value="12-15 Years">12-15 Years</option>
                <option value="15-20 Years">15-20 Years</option>

            </select>
        </div>

        <!-- Location -->

        <div class="form-group">
            <label><b>Location</b></label>

            <input type="text"
                   name="location"
                   class="form-control"
                   value="{{ job.location }}">
        </div>

        <!-- Min Salary -->

        <div class="form-group">
            <label><b>Minimum Salary</b></label>

            <input type="number"
                   name="min_salary"
                   class="form-control"
                   value="{{ job.min_salary }}">
        </div>

        <!-- Max Salary -->

        <div class="form-group">
            <label><b>Maximum Salary</b></label>

            <input type="number"
                   name="max_salary"
                   class="form-control"
                   value="{{ job.max_salary }}">
        </div>

        <!-- Skills -->

        <div class="form-group">
            <label><b>Skills</b></label>

            <input type="text"
                   name="skills"
                   class="form-control"
                   value="{{ job.skills }}">
        </div>

        <!-- Description -->

        <div class="form-group">
            <label><b>Job Description</b></label>

            <textarea name="job_description"
                      class="form-control"
                      rows="5">{{ job.job_description }}</textarea>
        </div>

        <!-- Start Date -->

        <div class="form-group">
            <label><b>Start Date</b></label>

            <input type="date"
                   name="start_date"
                   class="form-control"
                   value="{{ job.start_date|date:'Y-m-d' }}">
        </div>

        <!-- End Date -->

        <div class="form-group">
            <label><b>End Date</b></label>

            <input type="date"
                   name="end_date"
                   class="form-control"
                   value="{{ job.end_date|date:'Y-m-d' }}">
        </div>

        <!-- Current Company Logo -->

        {% if job.clogo %}
        <div class="form-group">
            <label><b>Current Company Logo</b></label><br>

            <img src="{{ job.clogo.url }}"
                 width="150"
                 height="150"
                 style="border:1px solid lightgray;">
        </div>
        {% endif %}

        <!-- Change Company Logo -->

        <div class="form-group">
            <label><b>Change Company Logo (Optional)</b></label>

            <input type="file"
                   name="clogo"
                   class="form-control">
        </div>

        <br>

        <button type="submit"
                class="btn btn-primary">
            Update Job
        </button>

        <a href="{% url 'Job_List' %}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% include 'footer.html' %}

{% if error == "no" %}
<script>
    alert("Job Details Updated Successfully");
    window.location.href = "{% url 'Job_List' %}";
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Something Went Wrong, Try Again...");
</script>
{% endif %}

{% endblock %}
