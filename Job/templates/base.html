{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CareerBridge{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="{% static 'Job/css/design-system.css' %}?v=1">
    <link rel="stylesheet" href="{% static 'Job/css/theme.css' %}?v=6">
    <script src="{% static 'Job/js/theme.js' %}?v=6"></script>
    {% block extra_css %}{% endblock %}
</head>
<body>
{% block nav %}{% include 'Navigation.html' %}{% endblock %}
{% block content %}{% endblock %}
{% block footer %}{% include 'Footer.html' %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
